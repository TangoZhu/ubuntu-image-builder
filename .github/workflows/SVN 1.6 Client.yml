name: Build static SVN 1.6.23 client (musl, https support)

# 手动触发，或者改成 push/tag 触发都行。
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PREFIX: ${{ github.workspace }}/sysroot
      # 全局用 musl-gcc 静态编译，这样 ./configure 过程中产生的探测用可执行文件
      # 也是完全静态的，不依赖宿主机是否注册了 musl 的动态链接器。
      CC: musl-gcc -static
      PKG_CONFIG_PATH: ${{ github.workspace }}/sysroot/lib/pkgconfig
      MAKEFLAGS: -j2

    steps:
      - name: 安装构建工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools musl-dev build-essential \
            autoconf automake libtool pkg-config \
            wget curl perl python3

      - name: 准备目录
        run: mkdir -p "$PREFIX" src

      # ------------------------------------------------------------------
      # 1. zlib
      # ------------------------------------------------------------------
      - name: 编译 zlib（静态）
        working-directory: src
        run: |
          # zlib.net 自己的 CDN 对 curl 默认请求会返回 415，改用 GitHub
          # 官方仓库自动生成的 tag 归档，更稳定。
          curl -fLO https://github.com/madler/zlib/archive/refs/tags/v1.3.2.tar.gz
          mv v1.3.2.tar.gz zlib-1.3.2.tar.gz
          tar xf zlib-1.3.2.tar.gz
          cd zlib-1.3.2
          CC="musl-gcc -static" ./configure --prefix="$PREFIX" --static
          make
          make install

      # ------------------------------------------------------------------
      # 2. expat（svn 用它解析 XML，包括 WebDAV 响应）
      # ------------------------------------------------------------------
      - name: 编译 expat（静态）
        working-directory: src
        run: |
          curl -fLO -A "Mozilla/5.0" https://github.com/libexpat/libexpat/releases/download/R_2_8_0/expat-2.8.0.tar.bz2
          tar xf expat-2.8.0.tar.bz2
          cd expat-2.8.0
          CC="musl-gcc -static" ./configure --prefix="$PREFIX" \
            --enable-static --disable-shared
          make
          make install

      # ------------------------------------------------------------------
      # 3. APR
      # ------------------------------------------------------------------
      - name: 编译 APR（静态）
        working-directory: src
        run: |
          curl -fLO -A "Mozilla/5.0" https://archive.apache.org/dist/apr/apr-1.7.6.tar.gz
          tar xf apr-1.7.6.tar.gz
          cd apr-1.7.6
          CC="musl-gcc -static" ./configure --prefix="$PREFIX" \
            --enable-static --disable-shared
          make
          make install

      # ------------------------------------------------------------------
      # 4. APR-util
      # ------------------------------------------------------------------
      - name: 编译 APR-util（静态）
        working-directory: src
        run: |
          curl -fLO -A "Mozilla/5.0" https://archive.apache.org/dist/apr/apr-util-1.6.3.tar.gz
          tar xf apr-util-1.6.3.tar.gz
          cd apr-util-1.6.3
          CC="musl-gcc -static" ./configure --prefix="$PREFIX" \
            --enable-static --disable-shared \
            --with-apr="$PREFIX" \
            --with-expat="$PREFIX" \
            --without-crypto --without-ldap --without-berkeley-db
          make
          make install

      # ------------------------------------------------------------------
      # 5. sqlite（用官方 autoconf 打包版本，直接产出 libsqlite3.a）
      # ------------------------------------------------------------------
      - name: 编译 sqlite（静态）
        working-directory: src
        run: |
          curl -fLO -A "Mozilla/5.0" https://www.sqlite.org/2024/sqlite-autoconf-3450300.tar.gz
          tar xf sqlite-autoconf-3450300.tar.gz
          cd sqlite-autoconf-3450300
          CC="musl-gcc -static" ./configure --prefix="$PREFIX" \
            --enable-static --disable-shared
          make
          make install

      # ------------------------------------------------------------------
      # 6. OpenSSL 1.1.1（关键选择：不用系统/OpenSSL 3.x，自己静态编译一份
      #    1.1.1 系列。neon 0.29.x 这种老代码用到的部分 API 在 OpenSSL 3.0
      #    里被彻底移除了，但在 1.1.1 里仍然保留（只是标了 deprecated），
      #    所以配 1.1.1 基本不用改 neon/svn 的代码。1.1.1w 是 1.1.1 分支
      #    最后一个版本。）
      # ------------------------------------------------------------------
      - name: 编译 OpenSSL 1.1.1w（静态）
        working-directory: src
        run: |
          curl -fLO -A "Mozilla/5.0" https://www.openssl.org/source/old/1.1.1/openssl-1.1.1w.tar.gz
          tar xf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          # no-secure-memory: OpenSSL 的 secure-heap 功能会 #include
          # <linux/mman.h>，这是内核 UAPI 头文件，musl-gcc 自带的私有
          # include 路径里没有（musl 只带 libc 自己的头，不带内核头），
          # 编译到 crypto/mem_sec.c 会报 "linux/mman.h: No such file or
          # directory"。这个功能对静态命令行工具没什么意义，直接关掉。
          CC="musl-gcc -static" ./Configure linux-x86_64 \
            no-shared no-async no-tests no-secure-memory \
            --prefix="$PREFIX" --openssldir="$PREFIX/ssl"
          make
          make install_sw

      # ------------------------------------------------------------------
      # 7. neon（WebDAV/HTTP(S) 客户端库，svn 的 ra_neon 模块要用它）
      #    原计划用跟 svn 1.6.23 同时代的 0.29.6，但该版本官方站点已经
      #    不再提供下载（只保留 0.31.0 及以后的版本），所以退而求其次用
      #    目前还能下载到的最老版本 0.31.2（2020 年）。这是当前整个方案
      #    里兼容性风险最大的一步：ra_neon.c 是 2012 年 svn 1.6.23 里的
      #    代码，跟 8 年后的 neon 0.31.2 头文件/API 对不对得上没法在这里
      #    验证，只能靠这一步实际编译报错来确认。如果这步或者下一步 svn
      #    编译因为 ra_neon 相关符号报错，把日志发回来，我再改。
      # ------------------------------------------------------------------
      - name: 编译 neon 0.31.2（静态）
        working-directory: src
        run: |
          curl -fLO -A "Mozilla/5.0" https://notroj.github.io/neon/neon-0.31.2.tar.gz
          tar xf neon-0.31.2.tar.gz
          cd neon-0.31.2
          CC="musl-gcc -static" \
          CPPFLAGS="-I$PREFIX/include" \
          LDFLAGS="-L$PREFIX/lib" \
          ./configure --prefix="$PREFIX" \
            --enable-static --disable-shared \
            --with-ssl=openssl \
            --with-expat \
            --with-zlib
          make
          make install

      # ------------------------------------------------------------------
      # 8. Subversion 1.6.23（1.6 分支最后一个正式版本）
      # ------------------------------------------------------------------
      - name: 下载并配置 Subversion 1.6.23
        working-directory: src
        run: |
          curl -fLO -A "Mozilla/5.0" https://archive.apache.org/dist/subversion/subversion-1.6.23.tar.bz2
          tar xf subversion-1.6.23.tar.bz2

      - name: 编译 Subversion 1.6.23（静态）
        working-directory: src/subversion-1.6.23
        run: |
          CC="musl-gcc -static" \
          CPPFLAGS="-I$PREFIX/include" \
          LDFLAGS="-static -L$PREFIX/lib" \
          ./configure \
            --disable-shared \
            --without-berkeley-db \
            --without-serf \
            --without-gnome-keyring \
            --without-kwallet \
            --without-swig \
            --with-apr="$PREFIX" \
            --with-apr-util="$PREFIX" \
            --with-neon="$PREFIX" \
            --with-zlib="$PREFIX" \
            --with-sqlite="$PREFIX"
          make

      # ------------------------------------------------------------------
      # 9. 校验产物：必须是完全静态，且带 https/http 支持
      # ------------------------------------------------------------------
      - name: 校验二进制
        working-directory: src/subversion-1.6.23
        run: |
          set -x
          BIN=subversion/svn/svn
          if [ ! -f "$BIN" ] && [ -f subversion/svn/.libs/svn ]; then
            BIN=subversion/svn/.libs/svn
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          file "$BIN"
          # 完全静态应输出 "not a dynamic executable"
          ldd "$BIN" || true
          "$BIN" --version

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: svn-1.6.23-static-musl-linux-x86_64
          path: src/subversion-1.6.23/${{ env.BIN }}
          if-no-files-found: error
