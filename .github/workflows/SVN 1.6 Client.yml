name: Build SVN 1.6.23 on Ubuntu 22.04 (系统库，非静态)

# 说明：这个版本不用 musl、不追求"哪个 Linux 都能跑"的完全静态二进制，
# 而是直接用 Ubuntu 22.04 apt 里现成的 apr/apr-util/expat/zlib/sqlite3/neon
# 开发包，动态链接编出来。产物只保证能在 Ubuntu 22.04（或者库版本兼容的
# 发行版）上跑，换个发行版大概率跑不起来——如果你的部署目标本来就是
# 22.04，这样最简单也最不容易踩坑；换发行版就得回去用 musl 那个版本。
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖（全部走 apt）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config curl \
            libapr1-dev libaprutil1-dev libexpat1-dev zlib1g-dev \
            libsqlite3-dev libssl-dev libneon27-gnutls-dev

      # svn 1.6.23 的 configure 脚本是 2012 年的，找系统 neon 库靠的是
      # 一个叫 neon-config 的脚本；新版 neon 的 -dev 包可能只提供
      # pkg-config 描述文件，没有这个脚本了。这里做个兼容判断：有就直接
      # 用，没有就从 pkg-config 的信息现造一个 shim 出来。
      - name: 处理 neon-config 兼容性
        run: |
          if command -v neon-config >/dev/null 2>&1; then
            echo "系统自带 neon-config：$(command -v neon-config)"
            echo "NEON_ARG=$(dirname "$(dirname "$(command -v neon-config)")")" >> "$GITHUB_ENV"
          else
            echo "没有 neon-config，用 pkg-config 生成一个兼容 shim"
            mkdir -p "$HOME/neon-shim/bin"
            NEON_CFLAGS="$(pkg-config --cflags neon)"
            NEON_LIBS="$(pkg-config --libs neon)"
            NEON_VERSION="$(pkg-config --modversion neon)"
            cat > "$HOME/neon-shim/bin/neon-config" <<EOF
          #!/bin/sh
          case "\$1" in
            --cflags) echo "$NEON_CFLAGS" ;;
            --libs) echo "$NEON_LIBS" ;;
            --version) echo "$NEON_VERSION" ;;
            --la-file) echo "" ;;
            *) echo "unsupported neon-config arg: \$1" >&2; exit 1 ;;
          esac
          EOF
            chmod +x "$HOME/neon-shim/bin/neon-config"
            echo "$HOME/neon-shim/bin" >> "$GITHUB_PATH"
            echo "NEON_ARG=$HOME/neon-shim" >> "$GITHUB_ENV"
          fi

      - name: 下载 Subversion 1.6.23
        run: |
          curl -fLO -A "Mozilla/5.0" https://archive.apache.org/dist/subversion/subversion-1.6.23.tar.bz2
          tar xf subversion-1.6.23.tar.bz2

      - name: 配置并编译
        working-directory: subversion-1.6.23
        run: |
          ./configure \
            --without-berkeley-db \
            --without-serf \
            --without-gnome-keyring \
            --without-kwallet \
            --without-swig \
            --with-apr=/usr \
            --with-apr-util=/usr \
            --with-neon="$NEON_ARG" \
            --with-zlib=/usr \
            --with-sqlite=/usr
          make -j"$(nproc)"

      - name: 校验产物
        working-directory: subversion-1.6.23
        run: |
          set -x
          BIN=subversion/svn/svn
          if [ ! -f "$BIN" ] && [ -f subversion/svn/.libs/svn ]; then
            BIN=subversion/svn/.libs/svn
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          file "$BIN"
          ldd "$BIN"
          "$BIN" --version

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: svn-1.6.23-ubuntu22.04-dynamic
          path: subversion-1.6.23/${{ env.BIN }}
          if-no-files-found: error
